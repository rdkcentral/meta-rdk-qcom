#@TYPE: Machine
#@NAME: ipq807x_64-rdk-broadband
#@RDK_FLAVOR: rdkb
#@NEEDED_BSPLAYERS: meta-rdk-qcom/meta-cmf-ipq
#@DESCRIPTION: Machine configuration for running a RDK broadband on IPQ807x_64

require conf/machine/ipq807x_64.conf

#set platform type (broadband, hybrid, or client)
MACHINEOVERRIDES .= ":ipq807x-64:ipq807x_64:ipq:broadband"
MACHINE_IMAGE_NAME = "ipq807x_64-rdk-broadband-image"
DISTRO_FEATURES_append = " dslite"

IMAGE_FSTYPES_DEBUGFS = "tar.gz"
# PREFERRED_VERSION_bridge-utils = "1.5"
PREFERRED_VERSION_ppp = "2.4.7"
PREFERRED_VERSION_linux-ipq ?= "5.4%"
R = "${IMAGE_ROOTFS}"

RELEASE_VERSION = "${REVISION}"
BBMASK .= "|meta-linaro/recipes-kernel"
BBMASK .= "|meta-rdk/recipes-support/base64"
BBMASK .= "|meta-ipq/recipes-packages/dnsmasq"
BBMASK .= "|meta-ipq/recipes-packages/libubox"
BBMASK .= "|meta-rdk-ext/recipes-core/volatile-binds/"
VOLATILE_BINDS_append = "/var/volatile/lib /var/lib\n"
INCOMPATIBLE_LICENSE = "GPLv3.0 GPLv3 GPL-3.0 GPLv3+ LGPLv3.0 LGPLv3 LGPL-3.0 LGPLv3+"

# Define GPLv3 exceptions for debug tools
DEBUG_GPLV3_EXCEPTIONS = " ${MLPREFIX}gdb:GPL-3.0-only ${MLPREFIX}gdb:LGPL-3.0-only ${MLPREFIX}binutils:GPL-3.0-only ${MLPREFIX}libbfd:GPL-3.0-only ${MLPREFIX}libopcodes:GPL-3.0-only"
INCOMPATIBLE_LICENSE_EXCEPTIONS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'debug_gplv3_tools', '${DEBUG_GPLV3_EXCEPTIONS}', '', d)}"
