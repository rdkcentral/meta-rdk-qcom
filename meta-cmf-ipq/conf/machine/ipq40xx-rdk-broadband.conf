#@TYPE: Machine
#@NAME: ipq40xx-rdk-broadband
#@RDK_FLAVOR: rdkb
#@NEEDED_BSPLAYERS: meta-cmf-ipq
#@DESCRIPTION: Machine configuration for running a RDK broadband on IPQ4019

require conf/machine/ipq40xx.conf

#set platform type (broadband, hybrid, or client)
MACHINEOVERRIDES .= ":ipq40xx:ipq:broadband"
MACHINE_IMAGE_NAME = "ipq40xx-rdk-broadband-image"

IMAGE_FSTYPES_DEBUGFS = "tar.gz"
PREFERRED_VERSION_bridge-utils = "1.5"
PREFERRED_VERSION_linux-ipq ?= "4.4%"

BBMASK .= "|meta-linaro/recipes-kernel"
VOLATILE_BINDS_append = "/var/volatile/lib /var/lib\n"
